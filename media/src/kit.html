<!doctype html>
<!-- CJS Portfolio media kit source. Render with: node media/src/render.mjs (headless Chrome).
     Layout is picked by ?a=<asset>. Everything is drawn with HTML/CSS + one <canvas> of particles. -->
<html><head><meta charset="utf-8"><title>kit</title><style>
:root{--bg:#0a0a0c;--bg2:#111115;--ink:#f4f1ea;--ink2:#a9a59c;--line:rgba(244,241,234,.12);--accent:#ff5b1f;
  --sans:Inter,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);overflow:hidden}
body{position:relative;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;opacity:.38;
  -webkit-mask-image:radial-gradient(ellipse 90% 80% at 70% 35%,#000 10%,transparent 78%)}
.halo{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,91,31,.18),rgba(255,91,31,.05) 55%,transparent)}
canvas{position:absolute;left:0;top:0}
.topbar{position:absolute;left:0;top:0;height:6px;width:100%;background:linear-gradient(90deg,var(--accent),transparent 70%)}
.mono{font-family:var(--mono);font-weight:500;text-transform:uppercase;letter-spacing:.16em}
.kick{display:flex;align-items:center;gap:14px;color:var(--accent)}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px rgba(255,91,31,.18),0 0 22px var(--accent);flex:none}
.title{font-weight:900;letter-spacing:-.055em;line-height:.9;margin:0}
.title .dot{display:inline-block;border-radius:50%;background:var(--accent);vertical-align:top}
.tag{font-weight:800;letter-spacing:-.035em;line-height:1.02;margin:0}
.tag em{font-style:normal;color:transparent;-webkit-text-stroke:2px var(--ink)}
.sub{color:var(--ink2);margin:0;line-height:1.4}
.pills{display:flex;gap:12px;flex-wrap:wrap}
.pill{border:1.5px solid rgba(244,241,234,.28);border-radius:999px;color:var(--ink);display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.pill.hot{background:var(--accent);border-color:var(--accent);color:#0a0a0c}
.pill b{font-weight:800}
.url{color:var(--ink)}
.url b{color:var(--accent);font-weight:500}
.abs{position:absolute}
</style></head><body>
<div class="grid"></div><div class="halo" id="halo"></div><canvas id="c"></canvas><div class="topbar"></div>
<div id="ui"></div>
<script>
const A = new URLSearchParams(location.search).get("a") || "announce";
// asset definitions: size, particle word box (x,y,w,h in px), and the HTML overlay
const L = {
  announce: { w:1600, h:900, halo:[760,-220,1100,1100], word:{text:"CJS", x:860, y:70, w:650, h:380}, gap:7, dot:3.4, swirl:[1400,215,170],
    ui:`<div class="abs" style="left:96px;top:96px"><div class="mono kick" style="font-size:22px"><span class="pulse"></span>Open source · MIT</div></div>
        <div class="abs" style="left:96px;bottom:96px;width:1040px">
          <h1 class="title" style="font-size:150px">CJS Portfolio<span class="dot" style="width:22px;height:22px;margin:18px 0 0 8px"></span></h1>
          <p class="tag" style="font-size:66px;margin-top:34px">Your agent builds it.<br><em>You own it.</em></p>
          <p class="sub" style="font-size:27px;margin-top:28px;max-width:900px">A one-page personal site template with an AGENTS.md any coding agent can follow, from first question to deploy.</p>
        </div>
        <div class="abs pills mono" style="right:96px;bottom:96px;font-size:19px;flex-direction:column;align-items:flex-end;gap:14px">
          <span class="pill hot" style="padding:13px 20px">by <b>CJS</b></span>
          <span class="pill" style="padding:13px 20px">Open source</span>
          <span class="url" style="margin-top:10px;font-size:22px;letter-spacing:.06em;text-transform:none">cjs<b>.</b>agency</span>
        </div>` },
  social: { w:1280, h:640, halo:[600,-200,900,900], word:{text:"CJS", x:700, y:120, w:500, h:260}, gap:6, dot:2.9, swirl:[1100,215,130],
    ui:`<div class="abs" style="left:80px;top:80px"><div class="mono kick" style="font-size:18px"><span class="pulse" style="width:10px;height:10px"></span>Open source · MIT</div></div>
        <div class="abs" style="left:80px;bottom:80px;width:900px">
          <h1 class="title" style="font-size:118px">CJS Portfolio<span class="dot" style="width:18px;height:18px;margin:14px 0 0 7px"></span></h1>
          <p class="tag" style="font-size:52px;margin-top:26px">Your agent builds it. <em>You own it.</em></p>
        </div>
        <div class="abs pills mono" style="right:80px;top:76px;font-size:16px">
          <span class="pill hot" style="padding:11px 17px">by <b>CJS</b></span>
        </div>` },
  square: { w:1080, h:1080, halo:[180,-260,1000,1000], word:{text:"CJS", x:90, y:190, w:900, h:450}, gap:7, dot:3.3, swirl:[850,380,170],
    ui:`<div class="abs" style="left:80px;top:72px;right:80px;display:flex;justify-content:space-between;align-items:center">
          <div class="mono kick" style="font-size:19px"><span class="pulse" style="width:11px;height:11px"></span>Open source · MIT</div>
          <span class="pill hot mono" style="padding:11px 17px;font-size:17px">by <b>CJS</b></span></div>
        <div class="abs" style="left:80px;right:80px;bottom:84px">
          <h1 class="title" style="font-size:124px">CJS Portfolio<span class="dot" style="width:18px;height:18px;margin:14px 0 0 7px"></span></h1>
          <p class="tag" style="font-size:64px;margin-top:30px">Your agent builds it.<br><em>You own it.</em></p>
          <p class="sub" style="font-size:26px;margin-top:26px">A personal site template with an AGENTS.md any coding agent can follow.</p>
        </div>` },
  banner: { w:1280, h:400, halo:[700,-300,800,800], word:{text:"CJS", x:790, y:58, w:420, h:250}, gap:5, dot:2.5, swirl:[1110,165,100],
    ui:`<div class="abs" style="left:64px;top:60px"><div class="mono kick" style="font-size:15px"><span class="pulse" style="width:9px;height:9px"></span>Open source · by CJS</div></div>
        <div class="abs" style="left:64px;bottom:60px;width:760px">
          <h1 class="title" style="font-size:96px">CJS Portfolio<span class="dot" style="width:14px;height:14px;margin:11px 0 0 6px"></span></h1>
          <p class="tag" style="font-size:40px;margin-top:22px">Your agent builds it. <em style="-webkit-text-stroke-width:1.5px">You own it.</em></p>
        </div>` },
  logo: { w:1024, h:1024, logo:true, halo:[112,112,800,800], word:{text:"CJS", x:112, y:322, w:760, h:380}, gap:11, dot:8, swirl:[880,330,90], dotAt:[915,330,30], ui:`` },
};
const C = L[A];
document.documentElement.style.cssText = `width:${C.w}px;height:${C.h}px`;
document.body.style.cssText = `width:${C.w}px;height:${C.h}px`;
const halo = document.getElementById("halo"); const [hx,hy,hw,hh] = C.halo;
Object.assign(halo.style,{left:hx+"px",top:hy+"px",width:hw+"px",height:hh+"px"});
document.getElementById("ui").innerHTML = C.ui;
if (C.logo) { // full-bleed square (avatars crop it); the SVG version has rounded corners
  document.querySelector(".grid").style.opacity = ".22"; document.querySelector(".topbar").remove(); }

let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;   // deterministic PRNG
const S = 2; // canvas supersampling
window.dots = []; // exported for the SVG logo
document.fonts.load("900 400px Inter").then(() => document.fonts.ready).then(() => {
  const c = document.getElementById("c"); c.width = C.w*S; c.height = C.h*S; c.style.width = C.w+"px"; c.style.height = C.h+"px";
  const x = c.getContext("2d"); x.scale(S,S);
  const W = C.word, o = document.createElement("canvas"); o.width = C.w; o.height = C.h;
  const ox = o.getContext("2d", { willReadFrequently:true });
  ox.font = "900 100px Inter"; const m = ox.measureText(W.text);
  const fs = Math.min(W.w / (m.width/100), W.h / 0.74);
  ox.font = `900 ${fs}px Inter`; ox.letterSpacing = (-0.04*fs)+"px"; ox.textAlign = "center"; ox.textBaseline = "middle"; ox.fillStyle = "#fff";
  ox.fillText(W.text, W.x + W.w/2, W.y + W.h/2);
  const d = ox.getImageData(0,0,C.w,C.h).data, g = C.gap, [sx,sy,sr] = C.swirl;
  // ambient dust first (behind)
  x.fillStyle = "rgba(244,241,234,.28)";
  for (let i=0;i<(C.logo?0:160);i++) x.fillRect(r()*C.w, r()*C.h, 1.6, 1.6);
  for (let yy=0; yy<C.h; yy+=g) for (let xx=0; xx<C.w; xx+=g) {
    if (d[(yy*C.w+xx)*4+3] <= 128) continue;
    let px = xx + (r()-.5)*g*.5, py = yy + (r()-.5)*g*.5, hot = r() < .045;
    const dx = px-sx, dy = py-sy, dd = Math.hypot(dx,dy);
    // a soft "cursor just passed through" disturbance: some dots knocked out along a swirl, glowing orange
    if (dd < sr && r() < (C.logo ? .35 : .42)) { const k = 1 - dd/sr, a = Math.atan2(dy,dx) + .8, f = k*k*sr*(.35 + r()*.55);
      px += Math.cos(a)*f; py += Math.sin(a)*f; hot = r() < .55 + k*.4; }
    x.fillStyle = hot ? "#ff5b1f" : "rgba(244,241,234,.92)"; x.fillRect(px, py, C.dot, C.dot);
    dots.push([+px.toFixed(1), +py.toFixed(1), hot]);
  }
  if (C.logo) { x.fillStyle = "#ff5b1f"; x.beginPath(); x.arc(C.dotAt[0], C.dotAt[1], C.dotAt[2], 0, 7); x.fill(); }
  if (C.logo) { // emit the particle mark as SVG (same dots), read back via --dump-dom
    const rects = (fillInk) => dots.map(([px,py,hot]) => `<rect x="${px}" y="${py}" width="${C.dot}" height="${C.dot}"${hot?' fill="#ff5b1f"':''}/>`).join("");
    const body = rects();
    const svg = (bg) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${C.w} ${C.h}" width="${C.w}" height="${C.h}" role="img" aria-label="CJS Portfolio">${bg?`<rect width="${C.w}" height="${C.h}" rx="${C.w*0.2}" fill="#0a0a0c"/>`:""}<g fill="#f4f1ea">${body}</g><circle cx="${C.dotAt[0]}" cy="${C.dotAt[1]}" r="${C.dotAt[2]}" fill="#ff5b1f"/></svg>`;
    const pre = document.createElement("textarea"); pre.id = "svgout"; pre.style.display = "none";
    pre.textContent = JSON.stringify({ dark: svg(true), transparent: svg(false) }); document.body.appendChild(pre);
  }
  document.title = "ready";
});
</script></body></html>
