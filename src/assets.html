<!doctype html>
<!-- Renders static/og.jpg (1200x630 share image) and the PNG icons from the config. Driven by scripts/assets.mjs. -->
<html><head><meta charset="utf-8"><title>assets</title></head><body>
<textarea id="out"></textarea>
<script>
(async () => {
  const P = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  const A = P.accent, INK = P.ink || "#f4f1ea", INK2 = P.ink2 || "#a9a59c", BG = P.bg || "#0a0a0c";
  const inkA = (a) => "rgba(" + [1, 3, 5].map((i) => parseInt(INK.slice(i, i + 2), 16)).join(",") + "," + a + ")";
  const SANS = 'Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  const MONO = '"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace';
  try { await Promise.all([document.fonts.load(`900 400px ${SANS}`), document.fonts.load(`400 24px ${SANS}`), document.fonts.load(`500 22px ${MONO}`)]); } catch {}
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647; // deterministic

  /* ---------- og image ---------- */
  const W = 1200, H = 630, S = 2;
  const c = document.createElement("canvas"); c.width = W * S; c.height = H * S;
  const x = c.getContext("2d"); x.scale(S, S);
  x.fillStyle = BG; x.fillRect(0, 0, W, H);
  x.fillStyle = inkA(.045);
  for (let i = 0; i <= W; i += 60) x.fillRect(i, 0, 1, H);
  for (let j = 0; j <= H; j += 60) x.fillRect(0, j, W, 1);
  const halo = x.createRadialGradient(830, 320, 0, 830, 320, 400);
  halo.addColorStop(0, P.accentRgba(.16)); halo.addColorStop(1, P.accentRgba(0));
  x.fillStyle = halo; x.fillRect(0, 0, W, H);
  // particle initials, fitted into a box on the right
  const box = { x: 600, y: 50, w: 540, h: 330 };
  const o = document.createElement("canvas"); o.width = W; o.height = H; const ox = o.getContext("2d");
  ox.textAlign = "center"; ox.textBaseline = "alphabetic";
  let fs = 400; ox.font = `900 ${fs}px ${SANS}`;
  let m = ox.measureText(P.initials);
  fs = Math.min(fs * box.w / m.width, fs * box.h / (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent));
  ox.font = `900 ${fs}px ${SANS}`; m = ox.measureText(P.initials);
  const cx = box.x + box.w / 2, base = box.y + box.h / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
  ox.fillStyle = "#fff"; ox.fillText(P.initials, cx, base);
  const d = ox.getImageData(0, 0, W, H).data, g = 6;
  const sw = [box.x + box.w * .86, box.y + box.h * .38, 110]; // soft swirl near the right edge
  for (let yy = 0; yy < H; yy += g) for (let xx = 0; xx < W; xx += g) {
    if (d[(yy * W + xx) * 4 + 3] <= 128) continue;
    let px = xx + (rnd() - .5) * g * .6, py = yy + (rnd() - .5) * g * .6, hot = rnd() < .04;
    const dx = px - sw[0], dy = py - sw[1], dd = Math.hypot(dx, dy) || 1;
    if (dd < sw[2] && rnd() < .42) { const k = 1 - dd / sw[2], f = k * k * sw[2] * (.35 + rnd() * .55); px += dx / dd * f - dy / dd * f * .6; py += dy / dd * f + dx / dd * f * .6; hot = true; }
    x.fillStyle = hot ? A : INK; x.fillRect(px, py, 3, 3);
  }
  x.fillStyle = inkA(.28);
  for (let i = 0; i < 140; i++) x.fillRect(rnd() * W, rnd() * H, 1.4, 1.4);
  const bar = x.createLinearGradient(0, 0, W * .7, 0); bar.addColorStop(0, A); bar.addColorStop(1, P.accentRgba(0));
  x.fillStyle = bar; x.fillRect(0, 0, W, 6);
  // text block, bottom-left
  const fit = (txt, font, max) => { let s = font[1]; x.font = `${font[0]} ${s}px ${font[2]}`; while (x.measureText(txt).width > max && s > 10) { s -= 2; x.font = `${font[0]} ${s}px ${font[2]}`; } return s; };
  x.textBaseline = "alphabetic"; x.textAlign = "left";
  const L = 72;
  x.font = `400 24px ${SANS}`; x.fillStyle = INK2; fit(P.line, [400, 24, SANS], 1056); x.fillText(P.line, L, H - 70);
  const ns = fit(P.name, [900, 92, SANS], 1056); x.fillStyle = INK;
  if ("letterSpacing" in x) x.letterSpacing = `${-.04 * ns}px`;
  x.fillText(P.name, L, H - 70 - 24 - 26); if ("letterSpacing" in x) x.letterSpacing = "0px";
  const ky = H - 70 - 24 - 26 - ns * .95 - 22;
  x.fillStyle = A; x.shadowColor = A; x.shadowBlur = 18; x.beginPath(); x.arc(L + 6, ky - 8, 6, 0, 7); x.fill(); x.shadowBlur = 0;
  x.font = `500 22px ${MONO}`; if ("letterSpacing" in x) x.letterSpacing = "3px";
  x.fillText(P.domain.toUpperCase(), L + 26, ky); if ("letterSpacing" in x) x.letterSpacing = "0px";
  const out = document.createElement("canvas"); out.width = W; out.height = H;
  const oc = out.getContext("2d"); oc.imageSmoothingQuality = "high"; oc.drawImage(c, 0, 0, W, H);

  /* ---------- icons from the favicon svg ---------- */
  const img = (svg) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); });
  const rounded = await img(P.favicon), square = await img(P.favicon.replace(/rx="[^"]*"/, 'rx="0"'));
  const icon = (im, n, bg) => { const k = document.createElement("canvas"); k.width = k.height = n; const kx = k.getContext("2d"); kx.imageSmoothingQuality = "high"; if (bg) { kx.fillStyle = BG; kx.fillRect(0, 0, n, n); } kx.drawImage(im, 0, 0, n, n); return k.toDataURL("image/png"); };
  document.getElementById("out").textContent = JSON.stringify({
    "og.jpg": out.toDataURL("image/jpeg", .9),
    "favicon-32.png": icon(rounded, 32),
    "apple-touch-icon.png": icon(square, 180, true),
    "icon-192.png": icon(square, 192, true),
    "icon-512.png": icon(square, 512, true),
  });
  document.title = "ready";
})();
</script></body></html>
